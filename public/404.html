<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>汽车及智能穿戴材料学习平台</title>
  <script>
    // GitHub Pages SPA 路由：仅编码仓库路径之后的应用路由，由 index.html 还原。
    (function () {
      var l = window.location;
      var pathSegments = l.pathname.split('/');
      var appRoute = pathSegments.slice(2).join('/');
      var appBase = pathSegments.slice(0, 2).join('/');
      var target = l.protocol + '//' + l.host + appBase + '/';
      var query = appRoute ? '?p=' + encodeURIComponent(appRoute + l.search) : l.search;
      l.replace(target + query + l.hash);
    })();
  </script>
</head>
<body></body>
</html>
