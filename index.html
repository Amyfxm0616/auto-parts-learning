<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汽车零部件学习平台</title>
    <script>
      // GitHub Pages SPA 路由还原
      (function(){
        var p = window.location.search.slice(1).split('&').find(function(s){ return s.startsWith('p='); });
        if (p) { p = decodeURIComponent(p.slice(2)); window.history.replaceState(null, null, '/' + p); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
